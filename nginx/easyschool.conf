# Redirection HTTP -> HTTPS
server {
    listen 80;
    server_name easyschoolcameroon.com www.easyschoolcameroon.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name easyschoolcameroon.com www.easyschoolcameroon.com;

    ssl_certificate /etc/letsencrypt/live/easyschoolcameroon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easyschoolcameroon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Taille max d'un envoi (épreuves : 10 Mo + marge)
    client_max_body_size 15M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ {
        alias /var/lib/docker/volumes/easyschoolcameroun_static_volume/_data/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Médias publics : jamais exécutés comme page web (bloque le XSS par fichier déposé)
    location /media/ {
        alias /var/lib/docker/volumes/easyschoolcameroun_media_volume/_data/;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options nosniff always;
        location ~* \.(html?|svg|js|xml|php)$ { return 403; }
    }

    # Envoi des vidéos par les professeurs
    location /profs/studio/ {
        client_max_body_size 350M;
        proxy_request_buffering off;
        proxy_read_timeout 600;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}
